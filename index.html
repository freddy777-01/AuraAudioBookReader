<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraAudio - Native Audiobook Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aura_theme_mode');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'night') {
            isDark = true;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      .pre-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at center, #ffffff 0%, #f8fafc 70%, #f1f5f9 100%);
        color: #0f172a;
        transition: background 0.3s ease, color 0.3s ease;
      }
      html.dark .pre-splash {
        background: radial-gradient(circle at center, #141926 0%, #090a0f 70%, #050608 100%);
        color: #ffffff;
      }
      .pre-splash-title {
        color: #0f172a;
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 6px 0;
        letter-spacing: -0.5px;
      }
      html.dark .pre-splash-title {
        color: #ffffff;
      }
      .pre-splash-sub {
        color: #64748b;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0;
      }
      html.dark .pre-splash-sub {
        color: #94a3b8;
      }
      .pre-splash-footer {
        position: absolute;
        bottom: 24px;
        text-align: center;
        font-family: monospace;
        font-size: 11px;
        color: #64748b;
      }
      html.dark .pre-splash-footer {
        color: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-aura-950 text-slate-900 dark:text-slate-100 antialiased overflow-hidden select-none">
    <div id="root">
      <div class="pre-splash">
        <div style="width:112px;height:112px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 10px 25px rgba(245,158,11,0.25));margin-bottom:20px;">
          <img src="/app-icon.png" alt="AuraAudio" style="width:100%;height:100%;object-fit:contain;" />
        </div>
        <h1 class="pre-splash-title">Aura<span style="color:#f59e0b;">Audio</span></h1>
        <p class="pre-splash-sub">Native Audiobook Experience</p>
        <div class="pre-splash-footer">
          <p style="margin:0 0 4px 0;">v0.2.7</p>
          <p style="color:#f59e0b;font-weight:600;margin:0;letter-spacing:0.5px;">Powered by FEMAG</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
