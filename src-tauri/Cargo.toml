[package]
name = "aura-audio"
version = "0.2.6"
description = "A high-performance, distraction-free local audiobook reader"
authors = ["AuraAudio Team"]
edition = "2021"

[lib]
name = "aura_audio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
lofty = "0.21"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
